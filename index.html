  <!-- FontAwesome CDN -->

<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="text-end mb-4">
          <a href="login.php" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-sign-in-alt"></i> ¿Ya tienes cuenta? Inicia Sesión
          </a>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title text-center"><i class="fas fa-user-plus"></i> Registro de Usuario</h3>
          </div>
          <div class="card-body">
            <form id="registroForm" action="process.php" method="POST">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="nombre" class="form-label"><i class="fas fa-user"></i> Nombre</label>
                  <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="apellido" class="form-label"><i class="fas fa-user"></i> Apellido</label>
                  <input type="text" class="form-control" id="apellido" name="apellido" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
              </div>
              <div class="mb-3">
                <label for="telefono" class="form-label"><i class="fas fa-phone"></i> Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" required>
              </div>
              <div class="mb-3">
                <label for="direccion" class="form-label"><i class="fas fa-map-marker-alt"></i> Dirección</label>
                <input type="text" class="form-control" id="direccion" name="direccion" required>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="ciudad" class="form-label"><i class="fas fa-city"></i> Ciudad</label>
                  <input type="text" class="form-control" id="ciudad" name="ciudad" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="pais" class="form-label"><i class="fas fa-globe"></i> País</label>
                  <input type="text" class="form-control" id="pais" name="pais" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="fechaNacimiento" class="form-label"><i class="fas fa-calendar-alt"></i> Fecha de
                  Nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
              </div>
              <div class="mb-3">
                <label for="genero" class="form-label"><i class="fas fa-venus-mars"></i> Género</label>
                <select class="form-select" id="genero" name="genero" required>
                  <option value="">Selecciona tu género</option>
                  <option value="Masculino">Masculino</option>
                  <option value="Femenino">Femenino</option>
                  <option value="Otro">Otro</option>
                  <option value="Prefiero no decirlo">Prefiero no decirlo</option>
                </select>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="password" class="form-label"><i class="fas fa-lock"></i> Contraseña</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="confirmPassword" class="form-label"><i class="fas fa-lock"></i> Confirmar
                    Contraseña</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Registrarse</button>
                <a href="listar.php" class="btn btn-info"><i class="fas fa-list"></i> Ver Usuarios Registrados</a>
